name: Build & Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # Every ~60 days to prevent TestFlight 90-day build expiry
    - cron: '0 9 1 1,3,5,7,9,11 *'

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Xcode version
        run: xcodebuild -version

      - name: Write Amplify prod config
        env:
          AMPLIFY_OUTPUTS_PROD: ${{ secrets.AMPLIFY_OUTPUTS_PROD }}
        run: echo "$AMPLIFY_OUTPUTS_PROD" | base64 --decode | gunzip > amplify_outputs_prod.json

      - name: Import distribution certificate
        env:
          DIST_CERTIFICATE_BASE64: ${{ secrets.DIST_CERTIFICATE_BASE64 }}
          DIST_CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$DIST_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$DIST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/NotOurGroceries_AppStore.mobileprovision

      - name: Stamp datetime build number
        run: |
          BUILD=$(date +%Y%m%d%H%M)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD/g" \
            GroceryApp.xcodeproj/project.pbxproj
          echo "Build number: $BUILD"

      - name: Bump build number (scheduled/manual only)
        if: github.event_name != 'push'
        run: |
          # For scheduled/manual runs bump marketing version patch so TestFlight accepts it
          # (same version + different build is sufficient, but Apple sometimes rejects)
          echo "Scheduled or manual run — build number already stamped above"

      # aws-sdk-swift is a very large repo and the runner cold-cloned it on every
      # run. Run 33110689526 hung 59 minutes inside that fetch and was killed by
      # the job timeout without compiling a single file. Cache keyed on the
      # resolved graph, so it only re-fetches when a dependency actually moves.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .spm-cache
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Bounded and retried on its own, so a hung fetch fails in 10 minutes with a
      # clear message instead of silently eating the whole 60-minute job budget.
      - name: Resolve SwiftPM dependencies
        run: |
          for attempt in 1 2 3; do
            echo "Resolve attempt $attempt"
            # perl alarm rather than `timeout`, which is GNU coreutils and is not
            # reliably present on macOS runners. perl always is.
            if perl -e 'alarm(600); exec @ARGV' xcodebuild -resolvePackageDependencies \
                 -project GroceryApp.xcodeproj \
                 -scheme GroceryApp \
                 -clonedSourcePackagesDirPath .spm-cache; then
              echo "Resolved on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed or timed out; retrying"
          done
          echo "Package resolution failed after 3 attempts"
          exit 1

      - name: Archive
        run: |
          xcodebuild archive \
            -project GroceryApp.xcodeproj \
            -scheme GroceryApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GroceryApp.xcarchive \
            -clonedSourcePackagesDirPath .spm-cache \
            -disableAutomaticPackageResolution \
            BUILD_ACTIVE_RESOURCES_ONLY=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/GroceryApp.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_CONTENT" \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/export/GroceryApp.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
